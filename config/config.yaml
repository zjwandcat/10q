backtest:
  benchmark: 000906.SH
  end_date: '20251231'
  start_date: '20070101'
data:
  index_dir: data/index/
  neutralization:
    active_scheme: scheme_b
    available_schemes:
      scheme_a: 双重OLS正交化（机构标准版）
      scheme_b: Rank-Z+双重OLS（推荐，抗极端值）
      scheme_b1: 非线性市值OLS（B基础 + ln(M)^2 + ln(M)^3，截面 demean 防御高阶共线性）
      scheme_b2: WLS 加权（sqrt(mktcap) 对角权重，缺 mktcap 内部退化为等权 OLS）
      scheme_d: 仅行业OLS（对照组）
      scheme_e: 分层中性化（行业内Rank+全截面市值OLS）
      scheme_f: 风格因子剥离（B基础 + 动量/换手/波动率 等 Barra 风格，缺列 raise）
      scheme_g: PCA 隐式风险（60 天 log-return 矩阵纯 NumPy SVD，缺矩阵 raise）
    params:
      scheme_b1:
        demean_log_mktcap: true
        mktcap_degree: 3
      scheme_b2:
        nan_to_zero: true
        weight: sqrt_mktcap
      scheme_f:
        style_factors:
        - momentum_return_20d
        - momentum_return_60d
        - volatility_20d
        - volatility_60d
        - liquidity_turnover_20d
        - liquidity_turnover_60d
      scheme_g:
        alignment: drop
        lookback_days: 60
        n_components: 5
  pool_dirs:
    scheme_a: data/pool_v2_scheme_a/
    scheme_b: data/pool_v2_scheme_b/
    scheme_b1: data/pool_v2_scheme_b1/
    scheme_b2: data/pool_v2_scheme_b2/
    scheme_d: data/pool_v2_scheme_d/
    scheme_e: data/pool_v2_scheme_e/
    scheme_f: data/pool_v2_scheme_f/
    scheme_g: data/pool_v2_scheme_g/
  raw_cache_dir: data/raw_cache/
  stock_filter:
